# ~/.tmux.conf
# ---------------------------------------------------------------------------
# Prefix: Ctrl+Space
# ---------------------------------------------------------------------------
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ---------------------------------------------------------------------------
# Core behavior
# ---------------------------------------------------------------------------
set -g mouse off
set -sg escape-time 10                 # low latency for vim mode switches
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on                 # lets nvim autoread work correctly inside tmux
set -g detach-on-destroy off 
set -s extended-keys on
set -as terminal-features ',*:extkeys'

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# ---------------------------------------------------------------------------
# Reload config
# ---------------------------------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"


# ---------------------------------------------------------------------------
# disable kill accept prompt
# ---------------------------------------------------------------------------
bind-key x kill-pane

# ---------------------------------------------------------------------------
# Splits / windows — open in the current pane's working directory
# ---------------------------------------------------------------------------
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Pane resize (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ---------------------------------------------------------------------------
# Copy mode — vi keys, system clipboard via wl-copy (Wayland/Hyprland)
# ---------------------------------------------------------------------------
setw -g mode-keys vi
# tmux-yank plugin (below) handles the actual copy-to-clipboard binding
# and auto-detects wl-copy on Wayland — no manual bind needed here.

# ---------------------------------------------------------------------------
# Session tree (prefix + s) — styled floating popup, Catppuccin Mocha accents
# ---------------------------------------------------------------------------
unbind s
bind s display-popup -w 70% -h 70% -E "tmux choose-tree -Zs"

set -g popup-border-style "fg=#cba6f7"       # mauve border
set -g popup-border-lines rounded
set -g mode-style "fg=#1e1e2e,bg=#b4befe"    # lavender highlight on selection



# ---------------------------------------------------------------------------
# Sesh Connect
# ---------------------------------------------------------------------------
bind-key "T" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""


# ---------------------------------------------------------------------------
# Theme — hardcoded Catppuccin Mocha hex values, no theme plugin
# ---------------------------------------------------------------------------
# base=#1e1e2e mantle=#181825 text=#cdd6f4 subtext0=#a6adc8
# overlay0=#6c7086 surface0=#313244 blue=#89b4fa lavender=#b4befe
# mauve=#cba6f7 green=#a6e3a1 peach=#fab387 red=#f38ba8

set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 40

set -g status-left "#[fg=#cba6f7,bold] #S #[fg=#6c7086]│ "
set -g status-right "#[fg=#6c7086]%H:%M "

setw -g window-status-current-format "#[fg=#89b4fa,bold]#I:#W"
setw -g window-status-format "#[fg=#6c7086]#I:#W"
setw -g window-status-separator "  "

set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

set -g message-style "fg=#1e1e2e,bg=#f9e2af"   # yellow, for command-line messages
set -g message-command-style "fg=#1e1e2e,bg=#f9e2af"

# ---------------------------------------------------------------------------
# Plugins (TPM) — minimal set only
# ---------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'   # gives seamless Ctrl-h/j/k/l between nvim splits and tmux panes

# Keep this line at the very bottom of the file
run '~/.tmux/plugins/tpm/tpm'
